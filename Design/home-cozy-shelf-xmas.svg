    <circle cx="260" cy="138" r="7" fill="#5B3B2A"/><circle cx="820" cy="138" r="7" fill="#5B3B2A"/>
    <rect class="s" x="90" y="200" width="900" height="220" rx="34" fill="#FFF8EC"/>
    <text x="540" y="262" text-anchor="middle" class="hand" style="font-size:32px">merry evening, Minaya ✦</text>
    <text x="540" y="360" text-anchor="middle" class="hand" style="font-size:84px;font-weight:bold;fill:#4E9A96">₼ 1 240,50</text>
