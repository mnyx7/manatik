    <path class="t" stroke="#FFF6EA" d="M575 540 H735 M575 830 H735"/>
    <circle class="s" cx="655" cy="620" r="46" fill="#FFF6EA"/>
    <path class="ic" d="M631 604 H679 V638 H631Z M631 604 L655 624 L679 604"/>
    <text class="lbl" x="655" y="730">Bills</text>
    <text class="val" x="655" y="776">2 due soon</text>
    <circle class="s" cx="737" cy="528" r="30" fill="#C2453A"/>
    <text x="737" y="540" text-anchor="middle" class="hand" style="font-size:34px;font-weight:bold;fill:#FFF6EA">2</text>
