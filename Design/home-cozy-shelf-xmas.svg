<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2340" width="1080" height="2340">
  <!-- iPhone-shaped (393x852pt at 2.75px/pt). Every #hit-* rect is a tap
       target of at least 73pt with 11pt+ between targets. -->
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFD98A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3A5C"/><stop offset="1" stop-color="#55628E"/>
    </linearGradient>
    <style>
      .s{stroke:#5B3B2A;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
      .t{stroke:#5B3B2A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .ic{stroke:#5B3B2A;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .hand{font-family:'Chalkboard SE','Marker Felt','Comic Sans MS',cursive;fill:#5B3B2A}
      .lbl{font-family:'Chalkboard SE','Marker Felt',cursive;font-size:36px;font-weight:bold;fill:#FFF6EA;text-anchor:middle}
      .val{font-family:'Chalkboard SE','Marker Felt',cursive;font-size:28px;fill:#FFF6EA;text-anchor:middle}
      .card{font-family:'Chalkboard SE','Marker Felt',cursive;font-size:30px;font-weight:bold;fill:#5B3B2A;text-anchor:middle}
      .tab{font-family:'Chalkboard SE','Marker Felt',cursive;font-size:24px;fill:#7A5A45;text-anchor:middle}
    </style>
  </defs>

  <g filter="url(#rough)">
