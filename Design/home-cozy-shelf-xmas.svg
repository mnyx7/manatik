    <path class="t" stroke="#FFF6EA" d="M115 530 H275 M115 830 H275"/>
    <circle class="s" cx="195" cy="610" r="46" fill="#FFF6EA"/>
    <path class="ic" d="M175 600 H215 V632 H175Z M184 600 C184 580 206 580 206 600"/>
