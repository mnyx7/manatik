    <ellipse class="t" cx="560" cy="2010" rx="436" ry="70" stroke="#FFF1E2" stroke-dasharray="4 16" stroke-width="5"/>

    <text x="70" y="100" class="hand" style="font-size:38px;font-weight:bold">9:41</text>

    <!-- BALANCE sign -->
