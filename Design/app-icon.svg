<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- manatik app icon: a savings arch with the manat sign, under a low sun.
       Full-bleed square; iOS applies its own corner mask. -->
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#1E2340" stroke-width="4.5"/>
    </pattern>
    <clipPath id="archClip">
      <path d="M262 870 V560 A250 250 0 0 1 762 560 V870Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#F2EBE1"/>

  <g filter="url(#rough)">
    <!-- sun -->
    <circle cx="690" cy="330" r="200" fill="#F1D488"/>
    <circle cx="704" cy="318" r="200" fill="none" stroke="#1E2340" stroke-width="5"/>

    <!-- arch -->
    <path d="M262 870 V560 A250 250 0 0 1 762 560 V870Z" fill="#D2654A"/>
    <rect x="560" y="300" width="220" height="580" fill="url(#hatch)" opacity="0.32" clip-path="url(#archClip)"/>
    <path d="M276 856 V546 A250 250 0 0 1 776 546 V856Z" fill="none" stroke="#1E2340" stroke-width="7"/>

    <!-- manat sign -->
    <path d="M378 760 V610 A134 134 0 0 1 646 610 V760" fill="none" stroke="#F2EBE1" stroke-width="58" stroke-linecap="round"/>
    <path d="M512 420 V760" fill="none" stroke="#F2EBE1" stroke-width="58" stroke-linecap="round"/>

    <!-- ground line with hatching -->
    <rect x="150" y="884" width="724" height="30" fill="url(#hatch)" opacity="0.55"/>
    <path d="M130 876 H894" stroke="#1E2340" stroke-width="9" stroke-linecap="round"/>

    <!-- sage leaf -->
    <path d="M800 870 C770 790 790 710 850 668 C880 740 862 820 800 870Z" fill="#9DB89A"/>
    <path d="M806 864 C830 790 842 730 850 676" fill="none" stroke="#1E2340" stroke-width="5" stroke-linecap="round"/>

    <!-- decoration -->
    <g stroke="#1E2340" stroke-width="6" stroke-linecap="round">
      <path d="M210 250 v54 M183 277 h54 M191 258 l38 38 M229 258 l-38 38"/>
      <path d="M180 470 h30 M196 455 v30"/>
    </g>
    <g fill="#1E2340">
      <circle cx="300" cy="380" r="7"/><circle cx="332" cy="356" r="6"/><circle cx="268" cy="410" r="5"/>
    </g>
  </g>

  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:multiply"/>
</svg>
