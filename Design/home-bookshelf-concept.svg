    <circle cx="250" cy="330" r="46" fill="#FFB27A"/>
    <path fill="#F6D7B0" d="M88 395 C150 360 220 380 342 350 V442 H88Z"/>
    <path class="t" d="M215 128 V442 M88 285 H342"/>
