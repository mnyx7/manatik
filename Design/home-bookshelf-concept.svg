<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFD98A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC9A0"/>
      <stop offset="1" stop-color="#FFE6B8"/>
    </linearGradient>
    <style>
      .s{stroke:#5B3B2A;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
      .t{stroke:#5B3B2A;stroke-width:2.5;stroke-linecap:round;fill:none}
      .hand{font-family:'Chalkboard SE','Marker Felt','Comic Sans MS',cursive;fill:#5B3B2A}
      .spine{font-family:'Chalkboard SE','Marker Felt',cursive;font-size:24px;fill:#FFF6EA;font-weight:bold}
    </style>
  </defs>

