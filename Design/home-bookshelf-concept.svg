  <!-- paper grain -->
  <rect width="1080" height="1350" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:multiply"/>

  <text x="40" y="1318" class="hand" style="font-size:30px;font-weight:bold">manatik · my cozy corner</text>
</svg>
